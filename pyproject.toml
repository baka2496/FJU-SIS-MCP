[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fju-sis-mcp"
version = "0.1.0"
description = "CLI and MCP server for Fu Jen Catholic University Student Information Platform (sis.fju.edu.tw)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
fjusis = "fju_sis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
